{% set name = "readability-lxml" %}
{% set version = "0.9" %}


package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: f7a5f88ee194ed6c5aa36d14593fbfb20c5d7bb8f3f5bc57734288d45a5abe26

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - poetry-core
    - python {{ python_min }}
  run:
    - chardet >=5.2.0,<6
    - cssselect >=1.3,<1.4
    - lxml >=5.4,<7
    - lxml-html-clean >=0.4.2,<0.5
    - python >={{ python_min }}

test:
  imports:
    - readability
    - readability.cleaners
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://github.com/buriy/python-readability
  summary: fast html to text parser (article readability tool) with python 3 support
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ickc
