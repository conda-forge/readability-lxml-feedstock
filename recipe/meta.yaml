{% set name = "readability-lxml" %}
{% set version = "0.8.4.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 9d2924f5942dd7f37fb4da353263b22a3e877ccf922d0e45e348e4177b035a53

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python
  run:
    - chardet
    - cssselect
    - lxml
    - python

test:
  imports:
    - readability
    - readability.compat
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://github.com/buriy/python-readability
  summary: fast html to text parser (article readability tool) with python 3 support
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ickc
