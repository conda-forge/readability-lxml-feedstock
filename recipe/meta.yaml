{% set name = "readability-lxml" %}
{% set version = "0.8.4" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/readability-lxml-{{ version }}.tar.gz
  sha256: fd1b8d1c2e1440546d8ecd336c177f6021bbd00e531de39d86be5103484304d9

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python
  run:
    - chardet
    - cssselect
    - lxml
    - python

test:
  imports:
    - readability
    - readability.compat
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://github.com/buriy/python-readability
  summary: fast html to text parser (article readability tool) with python 3 support
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ickc
